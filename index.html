<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Diary Planner</title>
<style>
  :root{
    --paper:#fdfbf3;
    --cream:#fef9ec;
    --line:#d9d2c0;
    --ink:#4a4a4a;
    --pink:#f4a6c0;
    --pink-deep:#ec6f9e;
    --pink-soft:#fce4ee;
    --sat:#5bb8d4;
    --sun:#e8638f;
    --hol-bg:#fde8ef;
    --sch-bg:#fff6d6;
    --today-bg:#efe6f7;
    --shadow:0 6px 20px rgba(120,90,90,.18);
    --c-purple:#d36ad6; --c-blue:#4aa3e0; --c-green:#5cb85c; --c-orange:#f0932b;
    --c-red:#e74c3c; --c-teal:#1abc9c; --c-pink:#ec6f9e; --c-violet:#9b59b6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Comic Sans MS','Segoe Print','Bradley Hand',cursive,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #fbe3ec 0 2px, transparent 3px) 0 0/46px 46px,
      linear-gradient(135deg,#fcecf2,#eef4f7);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{
    max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);
    box-shadow:var(--shadow);
    position:relative;
  }
  /* ---- top bunting / header ---- */
  header{
    position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#fbe1ea,#fef9ec);
    padding:14px 12px 10px;border-bottom:2px dashed var(--line);
  }
  .bunting{position:absolute;top:0;left:0;right:0;height:16px;
    background:repeating-linear-gradient(90deg,
      var(--pink) 0 14px,transparent 14px 18px,
      var(--sat) 18px 32px,transparent 32px 36px,
      #f7c948 36px 50px,transparent 50px 54px,
      var(--c-green) 54px 68px,transparent 68px 72px);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 14px,transparent 14px 18px);
    opacity:.55;}
  .hd-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;}
  .nav-btn{
    border:none;background:var(--cream);border:1.5px solid var(--line);
    border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--pink-deep);
    cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.08);line-height:1;
  }
  .nav-btn:active{transform:scale(.92);}
  .title{font-size:22px;letter-spacing:1px;color:#7a5a66;display:flex;align-items:baseline;gap:8px;}
  .title .y{font-size:15px;color:#a98;}
  .title .m{font-size:30px;font-style:italic;color:var(--pink-deep);font-weight:bold;}
  .gear{position:absolute;right:10px;top:30px;background:#f3e7c4;border:1.5px solid #d8c98e;
    border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer;color:#7a6a3a;box-shadow:0 2px 3px rgba(0,0,0,.12);}
  /* ---- weekday strip ---- */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);
    font-style:italic;font-size:12px;text-align:center;padding:4px 4px 2px;border-bottom:1px dashed var(--line);}
  .weekdays span{color:#a89;}
  .weekdays .sat{color:var(--sat);}
  .weekdays .sun{color:var(--sun);}
  /* ---- month grid ---- */
  .grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;
    overflow:hidden;min-height:0;}
  .cell{border-right:1px dashed var(--line);border-bottom:1px dashed var(--line);
    padding:2px 3px;overflow:hidden;position:relative;cursor:pointer;min-height:0;
    display:flex;flex-direction:column;}
  .cell:nth-child(7n){border-right:none;}
  .cell.oth{opacity:.4;}
  .cell.hol{background:var(--hol-bg);}
  .cell.sch{background:var(--sch-bg);}
  .cell.today{background:var(--today-bg);box-shadow:inset 0 0 0 2px var(--pink);}
  .dnum{font-size:13px;font-weight:bold;line-height:1;margin-bottom:1px;}
  .cell.sat .dnum{color:var(--sat);}
  .cell.sun .dnum{color:var(--sun);}
  .evs{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:1px;}
  .ev{font-size:9px;line-height:1.15;border-radius:3px;padding:0 2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;color:#fff;font-family:system-ui,sans-serif;}
  .ev.tag{font-weight:600;}
  .ev.plain{color:#3a6ea5;background:transparent;padding:0;font-weight:600;}
  .ev.holtxt{color:var(--c-red);background:transparent;padding:0;font-weight:700;}
  .ev.schtxt{color:#b07e00;background:transparent;padding:0;font-weight:700;font-style:italic;}
  .more{font-size:8px;color:#aa9;text-align:right;}
  /* ---- day detail bottom panel ---- */
  .detail{flex:0 0 auto;max-height:38%;overflow-y:auto;background:var(--cream);
    border-top:2px dashed var(--line);padding:8px 14px 4px;}
  .detail h3{margin:0 0 6px;font-size:16px;font-style:italic;color:#7a5a66;display:flex;align-items:center;gap:8px;}
  .detail .badge{font-size:10px;background:var(--pink-soft);color:var(--pink-deep);
    border-radius:10px;padding:2px 8px;font-family:system-ui;}
  .dlist{list-style:none;margin:0;padding:0;}
  .ditem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line);}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .dtime{font-size:11px;color:#988;font-family:system-ui;width:48px;flex:0 0 auto;line-height:1.2;}
  .dtitle{font-size:14px;flex:1;}
  .del{border:none;background:none;color:#c99;font-size:16px;cursor:pointer;}
  .empty{color:#bbb;font-size:12px;font-style:italic;padding:6px 0;}
  /* ---- bottom toolbar ---- */
  .toolbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
    background:linear-gradient(180deg,#fce4ee,#f8c9dc);border-top:1px solid #f0b8cf;}
  .tb{border:none;background:none;padding:8px 0 9px;text-align:center;cursor:pointer;color:#a05878;}
  .tb .ic{font-size:18px;display:block;}
  .tb .lb{font-size:10px;font-family:system-ui;}
  .tb.add{background:var(--pink-deep);color:#fff;}
  .tb:active{filter:brightness(.95);}
  /* ---- modal ---- */
  .ov{position:fixed;inset:0;background:rgba(80,60,70,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:14px;}
  .ov.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:380px;border-radius:14px;
    box-shadow:var(--shadow);max-height:90dvh;overflow-y:auto;
    border:3px solid #fff;position:relative;}
  .modal::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    width:60px;height:22px;background:var(--pink);border-radius:0 0 8px 8px;
    clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);}
  .mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;}
  .mhd h2{margin:0;font-size:20px;color:#7a5a66;}
  .mbody{padding:4px 16px 16px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:12px;color:#988;margin-bottom:3px;font-family:system-ui;}
  .fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);
    border-radius:8px;font-size:14px;background:#fff;font-family:system-ui;color:var(--ink);}
  .fld textarea{resize:vertical;min-height:54px;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .allday{display:flex;align-items:center;gap:6px;font-size:13px;font-family:system-ui;}
  .allday input{width:auto;}
  .colors{display:flex;gap:8px;flex-wrap:wrap;}
  .cdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .cdot.sel{border-color:#7a5a66;}
  .mbtns{display:flex;gap:10px;margin-top:6px;}
  .mbtns button{flex:1;padding:11px;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-family:system-ui;font-weight:600;}
  .save{background:var(--pink-deep);color:#fff;}
  .cancel{background:#eee;color:#888;}
  /* settings list */
  .sline{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px dotted var(--line);font-family:system-ui;font-size:14px;}
  .sline small{display:block;color:#aa9;font-size:11px;margin-top:2px;}
  .switch{position:relative;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#ddd;border-radius:24px;transition:.2s;cursor:pointer;}
  .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--pink-deep);}
  .switch input:checked + .slider::before{transform:translateX(20px);}
  .ghost{width:100%;padding:10px;margin-top:6px;border:1.5px dashed var(--line);background:#fff;
    border-radius:10px;font-family:system-ui;font-size:13px;color:#7a5a66;cursor:pointer;}
  .legend{display:flex;gap:12px;font-size:10px;font-family:system-ui;padding:3px 10px;color:#998;border-bottom:1px dashed var(--line);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#5a4650;color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;font-family:system-ui;opacity:0;transition:.3s;z-index:99;pointer-events:none;}
  .toast.show{opacity:.95;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bunting"></div>
    <button class="gear" id="gearBtn">⚙ Setting</button>
    <div class="hd-row">
      <button class="nav-btn" id="prevBtn">‹</button>
      <div class="title"><span class="y" id="hY">2026</span><span class="m" id="hM">Mar</span></div>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
  </header>

  <div class="weekdays">
    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
    <span class="sat">Sat</span><span class="sun">Sun</span>
  </div>
  <div class="legend">
    <span><i style="background:var(--hol-bg);border:1px solid var(--c-red)"></i>Public holiday</span>
    <span><i style="background:var(--sch-bg);border:1px solid #b07e00"></i>School holiday</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="detail" id="detail"></div>

  <div class="toolbar">
    <button class="tb" id="monthlyBtn"><span class="ic">📅</span><span class="lb">Monthly</span></button>
    <button class="tb" id="todayBtn"><span class="ic">↺</span><span class="lb">Today</span></button>
    <button class="tb" id="syncBtn"><span class="ic">🔄</span><span class="lb">Sync iPhone</span></button>
    <button class="tb add" id="addBtn"><span class="ic">＋</span><span class="lb">Add Event</span></button>
  </div>
</div>

<!-- Event modal -->
<div class="ov" id="evOv">
  <div class="modal">
    <div class="mhd"><h2 id="evTitle">Add event</h2><button class="nav-btn" id="evClose" style="width:30px;height:30px;font-size:16px">✕</button></div>
    <div class="mbody">
      <div class="fld"><label>Title</label><input id="fTitle" placeholder="Enter title"></div>
      <div class="row2">
        <div class="fld"><label>Date</label><input type="date" id="fDate"></div>
        <div class="fld"><label class="allday"><input type="checkbox" id="fAllDay"> All-day</label></div>
      </div>
      <div class="row2" id="timeRow">
        <div class="fld"><label>Start</label><input type="time" id="fStart" value="09:00"></div>
        <div class="fld"><label>End</label><input type="time" id="fEnd" value="10:00"></div>
      </div>
      <div class="fld"><label>Color</label><div class="colors" id="colors"></div></div>
      <div class="fld"><label>Location</label><input id="fLoc" placeholder="Enter location"></div>
      <div class="fld"><label>Note</label><textarea id="fNote" placeholder="Write note"></textarea></div>
      <div class="mbtns">
        <button class="cancel" id="evCancel">Cancel</button>
        <button class="save" id="evSave">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="ov" id="setOv">
  <div class="modal">
    <div class="mhd"><h2>Settings</h2><button class="nav-btn" id="setClose" style="width:30px;height:30px;font-size:16px">✕</button></div>
    <div class="mbody">
      <div class="sline"><span>Show SG public holidays<small>Auto-loaded for 2026</small></span>
        <label class="switch"><input type="checkbox" id="tHol" checked><span class="slider"></span></label></div>
      <div class="sline"><span>Show SG school holidays<small>MOE vacation blocks 2026</small></span>
        <label class="switch"><input type="checkbox" id="tSch" checked><span class="slider"></span></label></div>
      <div class="sline"><span>iPhone Calendar sync<small>Connect & 2-way sync</small></span>
        <label class="switch"><input type="checkbox" id="tSync"><span class="slider"></span></label></div>
      <button class="ghost" id="impBtn">📥 Import .ics from iPhone</button>
      <input type="file" id="impFile" accept=".ics" style="display:none">
      <button class="ghost" id="expBtn">📤 Export my events (.ics) to iPhone</button>
      <button class="ghost" id="subBtn">🔗 Get holiday subscription link (.ics)</button>
      <button class="ghost" id="clrBtn" style="color:#c66;border-color:#ecc">🗑 Clear all my events</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================== DATA ====================== */
const STORE='diaryPlanner_v1';
const COLORS=[
 {n:'pink',c:'var(--c-pink)',hex:'#ec6f9e'},{n:'purple',c:'var(--c-purple)',hex:'#d36ad6'},
 {n:'blue',c:'var(--c-blue)',hex:'#4aa3e0'},{n:'green',c:'var(--c-green)',hex:'#5cb85c'},
 {n:'orange',c:'var(--c-orange)',hex:'#f0932b'},{n:'red',c:'var(--c-red)',hex:'#e74c3c'},
 {n:'teal',c:'var(--c-teal)',hex:'#1abc9c'},{n:'violet',c:'var(--c-violet)',hex:'#9b59b6'}
];
// SG public holidays 2026 (MOM official). [date, name]
const SG_HOL=[
 ['2026-01-01','New Year'],['2026-02-17','CNY'],['2026-02-18','CNY'],
 ['2026-03-21','Hari Raya Puasa'],['2026-04-03','Good Friday'],['2026-05-01','Labour Day'],
 ['2026-05-27','Hari Raya Haji'],['2026-05-31','Vesak Day'],['2026-06-01','Vesak (lieu)'],
 ['2026-08-09','National Day'],['2026-08-10','Natl Day (lieu)'],['2026-11-08','Deepavali'],
 ['2026-11-09','Deepavali (lieu)'],['2026-12-25','Christmas']
];
// MOE school vacation blocks 2026 (inclusive ranges) + single days
const SG_SCH_RANGES=[
 ['2026-03-14','2026-03-22','Mar break'],
 ['2026-05-30','2026-06-28','June holidays'],
 ['2026-09-05','2026-09-13','Sep break'],
 ['2026-11-21','2026-12-31','Year-end holidays']
];
const SG_SCH_DAYS=[
 ['2026-07-06','Youth Day'],['2026-09-04','Teachers Day'],['2026-10-02',"Children's Day"]
];

/* ====================== STATE ====================== */
let state=load();
let view=new Date(2026,2,1); // start Mar 2026 like sample
let selKey=fmt(new Date(2026,2,22));
let editId=null, pickColor='pink';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function load(){try{return JSON.parse(localStorage.getItem(STORE))||{events:[],set:{hol:true,sch:true,sync:false}};}
  catch(e){return {events:[],set:{hol:true,sch:true,sync:false}};}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}

/* ----- holiday lookups ----- */
function holName(k){if(!state.set.hol)return null;const h=SG_HOL.find(x=>x[0]===k);return h?h[1]:null;}
function schName(k){if(!state.set.sch)return null;
  for(const[s,e,n]of SG_SCH_RANGES){if(k>=s&&k<=e)return n;}
  const d=SG_SCH_DAYS.find(x=>x[0]===k);return d?d[1]:null;}

/* ====================== RENDER GRID ====================== */
function render(){
  const y=view.getFullYear(),m=view.getMonth();
  document.getElementById('hY').textContent=y;
  document.getElementById('hM').textContent=MON[m];
  const grid=document.getElementById('grid');grid.innerHTML='';
  const first=new Date(y,m,1);
  let start=(first.getDay()+6)%7; // Mon=0
  const startDate=new Date(y,m,1-start);
  const todayKey=fmt(new Date());
  for(let i=0;i<42;i++){
    const d=new Date(startDate);d.setDate(startDate.getDate()+i);
    const k=fmt(d),inMonth=d.getMonth()===m,dow=(d.getDay()+6)%7;
    const cell=document.createElement('div');cell.className='cell';
    if(!inMonth)cell.classList.add('oth');
    if(dow===5)cell.classList.add('sat');if(dow===6)cell.classList.add('sun');
    const hn=holName(k),sn=schName(k);
    if(hn)cell.classList.add('hol');else if(sn)cell.classList.add('sch');
    if(k===todayKey)cell.classList.add('today');
    if(k===selKey)cell.style.outline='2px solid var(--pink-deep)';
    cell.innerHTML='<div class="dnum">'+d.getDate()+'</div>';
    const evs=document.createElement('div');evs.className='evs';
    if(hn){const e=document.createElement('div');e.className='ev holtxt';e.textContent=hn;evs.appendChild(e);}
    if(sn){const e=document.createElement('div');e.className='ev schtxt';e.textContent=sn;evs.appendChild(e);}
    const dayEvs=state.events.filter(ev=>ev.date===k).sort(srt);
    let shown=0,room=hn||sn?2:4;
    for(const ev of dayEvs){
      if(shown>=room){const mo=document.createElement('div');mo.className='more';mo.textContent='+'+(dayEvs.length-shown);evs.appendChild(mo);break;}
      const e=document.createElement('div');
      const col=COLORS.find(c=>c.n===ev.color)||COLORS[0];
      e.className='ev tag';e.style.background=col.hex;e.textContent=ev.title;
      evs.appendChild(e);shown++;
    }
    cell.appendChild(evs);
    cell.onclick=()=>{selKey=k;render();};
    grid.appendChild(cell);
  }
  renderDetail();
}
function srt(a,b){if(a.allDay&&!b.allDay)return -1;if(!a.allDay&&b.allDay)return 1;return (a.start||'').localeCompare(b.start||'');}

/* ====================== DETAIL PANEL ====================== */
function renderDetail(){
  const d=parse(selKey),det=document.getElementById('detail');
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const hn=holName(selKey),sn=schName(selKey);
  let badge='';if(hn)badge='<span class="badge">🎉 '+hn+'</span>';else if(sn)badge='<span class="badge">🏫 '+sn+'</span>';
  let html='<h3>'+(d.getMonth()+1)+'/'+d.getDate()+' ('+dn+') '+badge+'</h3>';
  const evs=state.events.filter(e=>e.date===selKey).sort(srt);
  if(!evs.length&&!hn&&!sn)html+='<div class="empty">No events. Tap + to add.</div>';
  html+='<ul class="dlist">';
  for(const e of evs){
    const col=COLORS.find(c=>c.n===e.color)||COLORS[0];
    const t=e.allDay?'All<br>day':((e.start||'')+'<br>'+(e.end||''));
    html+='<li class="ditem"><span class="dtime">'+t+'</span>'+
      '<span class="dot" style="background:'+col.hex+'"></span>'+
      '<span class="dtitle">'+esc(e.title)+(e.loc?' <small style="color:#aa9">@ '+esc(e.loc)+'</small>':'')+'</span>'+
      '<button class="del" data-id="'+e.id+'">✕</button></li>';
  }
  html+='</ul>';
  det.innerHTML=html;
  det.querySelectorAll('.del').forEach(b=>b.onclick=()=>{delEvent(b.dataset.id);});
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ====================== EVENT CRUD ====================== */
function openEvent(id){
  editId=id||null;
  const o=document.getElementById('evOv');o.classList.add('show');
  document.getElementById('evTitle').textContent=id?'Edit event':'Add event';
  if(id){const e=state.events.find(x=>x.id===id);
    fTitle.value=e.title;fDate.value=e.date;fAllDay.checked=e.allDay;
    fStart.value=e.start||'09:00';fEnd.value=e.end||'10:00';fLoc.value=e.loc||'';fNote.value=e.note||'';
    pickColor=e.color||'pink';
  }else{
    fTitle.value='';fDate.value=selKey;fAllDay.checked=false;
    fStart.value='09:00';fEnd.value='10:00';fLoc.value='';fNote.value='';pickColor='pink';
  }
  paintColors();toggleTime();fTitle.focus();
}
function closeEvent(){document.getElementById('evOv').classList.remove('show');}
function paintColors(){const box=document.getElementById('colors');box.innerHTML='';
  COLORS.forEach(c=>{const d=document.createElement('div');d.className='cdot'+(c.n===pickColor?' sel':'');
    d.style.background=c.hex;d.onclick=()=>{pickColor=c.n;paintColors();};box.appendChild(d);});}
function toggleTime(){document.getElementById('timeRow').style.display=fAllDay.checked?'none':'flex';}
function saveEvent(){
  const t=fTitle.value.trim();if(!t){toast('Enter a title');return;}
  const obj={id:editId||('e'+Date.now()+Math.random().toString(36).slice(2,6)),
    title:t,date:fDate.value,allDay:fAllDay.checked,
    start:fAllDay.checked?'':fStart.value,end:fAllDay.checked?'':fEnd.value,
    color:pickColor,loc:fLoc.value.trim(),note:fNote.value.trim()};
  if(editId){const i=state.events.findIndex(x=>x.id===editId);state.events[i]=obj;}
  else state.events.push(obj);
  save();closeEvent();selKey=obj.date;view=parse(obj.date);view.setDate(1);render();toast('Saved ✓');
}
function delEvent(id){state.events=state.events.filter(e=>e.id!==id);save();render();toast('Deleted');}

/* ====================== iPHONE SYNC (ICS) ====================== */
function pad(n){return String(n).padStart(2,'0');}
function icsDate(date,time){const d=parse(date);
  if(!time)return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const[h,mi]=time.split(':');return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+h+mi+'00';}
function buildICS(events,calName){
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DiaryPlanner//EN\r\nCALSCALE:GREGORIAN\r\n';
  s+='X-WR-CALNAME:'+calName+'\r\n';
  for(const e of events){
    s+='BEGIN:VEVENT\r\nUID:'+e.id+'@diaryplanner\r\n';
    if(e.allDay){const d=parse(e.date),nx=new Date(d);nx.setDate(d.getDate()+1);
      s+='DTSTART;VALUE=DATE:'+icsDate(e.date)+'\r\nDTEND;VALUE=DATE:'+fmt(nx).replace(/-/g,'')+'\r\n';}
    else{s+='DTSTART:'+icsDate(e.date,e.start)+'\r\nDTEND:'+icsDate(e.date,e.end||e.start)+'\r\n';}
    s+='SUMMARY:'+(e.title||'').replace(/\n/g,' ')+'\r\n';
    if(e.loc)s+='LOCATION:'+e.loc+'\r\n';
    if(e.note)s+='DESCRIPTION:'+e.note.replace(/\n/g,'\\n')+'\r\n';
    s+='END:VEVENT\r\n';
  }
  return s+'END:VCALENDAR\r\n';
}
function download(name,text){const b=new Blob([text],{type:'text/calendar'});
  const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);}
function exportEvents(){if(!state.events.length){toast('No events to export');return;}
  download('my-diary-events.ics',buildICS(state.events,'My Diary Planner'));
  toast('Exported. Open file on iPhone → Add to Calendar');}
function exportHolidays(){
  const hev=SG_HOL.map(h=>({id:'h'+h[0],title:'🇸🇬 '+h[1],date:h[0],allDay:true}));
  const sev=[];SG_SCH_RANGES.forEach(r=>sev.push({id:'s'+r[0],title:'🏫 '+r[2],date:r[0],allDay:true,end:'',start:''}));
  SG_SCH_DAYS.forEach(d=>sev.push({id:'sd'+d[0],title:'🏫 '+d[1],date:d[0],allDay:true}));
  download('sg-holidays-2026.ics',buildICS([...hev,...sev],'SG Holidays 2026'));
  toast('Subscribe link saved. On iPhone: Calendar→Add→Import');}
function parseICS(text){
  const out=[];const blocks=text.split('BEGIN:VEVENT').slice(1);
  for(const b of blocks){
    const g=(re)=>{const m=b.match(re);return m?m[1].trim():'';};
    const sum=g(/SUMMARY[^:]*:(.*)/);
    const ds=g(/DTSTART[^:]*:([0-9T]+)/);if(!ds)continue;
    const de=g(/DTEND[^:]*:([0-9T]+)/);
    const loc=g(/LOCATION[^:]*:(.*)/);const note=g(/DESCRIPTION[^:]*:(.*)/);
    const allDay=!ds.includes('T');
    const date=ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8);
    let st='',en='';
    if(!allDay){st=ds.slice(9,11)+':'+ds.slice(11,13);if(de)en=de.slice(9,11)+':'+de.slice(11,13);}
    out.push({id:'i'+Date.now()+out.length,title:sum||'Imported',date,allDay,start:st,end:en,
      color:'blue',loc,note:note.replace(/\\n/g,'\n')});
  }
  return out;}
function importICS(file){const r=new FileReader();
  r.onload=()=>{try{const ev=parseICS(r.result);if(!ev.length){toast('No events found');return;}
    state.events.push(...ev);save();render();toast('Imported '+ev.length+' events ✓');}
    catch(e){toast('Import failed');}};
  r.readAsText(file);}

/* ====================== SETTINGS ====================== */
function openSet(){document.getElementById('setOv').classList.add('show');
  tHol.checked=state.set.hol;tSch.checked=state.set.sch;tSync.checked=state.set.sync;}
function closeSet(){document.getElementById('setOv').classList.remove('show');}

/* ====================== UI WIRING ====================== */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1900);}
prevBtn.onclick=()=>{view.setMonth(view.getMonth()-1);render();};
nextBtn.onclick=()=>{view.setMonth(view.getMonth()+1);render();};
todayBtn.onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);selKey=fmt(n);render();};
monthlyBtn.onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render();};
addBtn.onclick=()=>openEvent(null);
syncBtn.onclick=()=>{openSet();toast('Sync via Import/Export below');};
evClose.onclick=evCancel.onclick=closeEvent;
evSave.onclick=saveEvent;
fAllDay.onchange=toggleTime;
document.getElementById('evOv').onclick=e=>{if(e.target.id==='evOv')closeEvent();};
gearBtn.onclick=openSet;setClose.onclick=closeSet;
document.getElementById('setOv').onclick=e=>{if(e.target.id==='setOv')closeSet();};
tHol.onchange=()=>{state.set.hol=tHol.checked;save();render();};
tSch.onchange=()=>{state.set.sch=tSch.checked;save();render();};
tSync.onchange=()=>{state.set.sync=tSync.checked;save();
  toast(tSync.checked?'iPhone sync ON — use Import/Export to move events':'Sync off');};
expBtn.onclick=exportEvents;
subBtn.onclick=exportHolidays;
impBtn.onclick=()=>impFile.click();
impFile.onchange=e=>{if(e.target.files[0])importICS(e.target.files[0]);e.target.value='';};
clrBtn.onclick=()=>{if(confirm('Delete ALL your events? Holidays stay.')){state.events=[];save();render();toast('Cleared');}};
// double-tap detail to edit first event / open add
detail.ondblclick=()=>{const e=state.events.find(x=>x.date===selKey);if(e)openEvent(e.id);else openEvent(null);};

    {id:'seed2',title:'Orchard',date:'2026-05-22',allDay:false,start:'10:30',end:'11:30',color:'pink',loc:'Orchard',note:''}
  ];save();
}
render();
